[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqueitas-cli"
version = "0.1.0"
description = "Aqueitas Engineering Operating System CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "asyncpg",
    "openai",
    "python-dotenv"
]

[project.scripts]
aq = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*"]

